<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Naše svatba</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            color: #4a4a4a;
            background-color: #faf9f6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            position: relative;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #333;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Ikona mobilního menu (na PC skrytá) */
        .menu-toggle {
            display: none;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #333;
        }

        .gallery-container {
            padding: 10px;
            width: 100%;
        }
        .gallery-title {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 36px;
            margin: 15px 0;
            color: #333;
        }
        .padlet-iframe {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 700px;
            border: none;
            display: block;
        }

        /* Responsive zobrazení a Mobilní menu */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 20px 15px;
            }

            .menu-toggle {
                display: block;
                margin-top: 15px;
            }

            nav {
                display: none;
                flex-direction: column;
                width: 100%;
                text-align: center;
                margin-top: 15px;
            }

            nav.active {
                display: flex;
            }

            nav a {
                margin: 10px 0;
                font-size: 13px;
            }

            .gallery-title {
                font-size: 28px;
            }

            .padlet-iframe {
                height: 60vh;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLÁRA & ROMAN</div>
        <button class="menu-toggle" id="menuToggle" aria-label="Otevřít menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <nav id="mainNav">
            <a href="index.html">Úvod</a>
            <a href="o-nas.html">O nás</a>
            <a href="svatba.html">Svatba</a>
            <a href="galerie.html">Galerie</a>
            <a href="kontakt.html">Kontakt</a>
        </nav>
    </header>

    <main class="gallery-container">
        <h1 class="gallery-title">Fotogalerie</h1>
        <iframe src="https://padlet.com/embed/s02401yg5bve72i2wj0v" allow="camera;microphone;geolocation;display-capture;clipboard-write" class="padlet-iframe"></iframe>
    </main>

    <script>
        // Skript pro mobilní hamburger menu
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');

        menuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('active');
        });

        // Zavření menu po kliknutí na odkaz
        document.querySelectorAll('#mainNav a').forEach(link => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('active');
            });
        });
    </script>
</body>
</html>
