<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Naše svatba</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            color: #4a4a4a;
            background-color: #faf9f6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #333;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .gallery-container {
            padding: 10px;
            width: 100%;
        }
        .gallery-title {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 36px;
            margin: 15px 0;
            color: #333;
        }
        .padlet-iframe {
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 700px;
            border: none;
            display: block;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
                padding: 15px;
            }
            header .logo {
                margin-bottom: 15px;
                text-align: center;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            nav a {
                margin-left: 0;
            }
            .gallery-title {
                font-size: 28px;
            }
            .padlet-iframe {
                height: 60vh;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLÁRA & ROMAN</div>
        <nav>
            <a href="index.html">Úvod</a>
            <a href="index.html#o-nas">O nás</a>
            <a href="index.html#svatba">Svatba</a>
            <a href="galerie.html">Galerie</a>
            <a href="index.html#kontakt">Kontakt</a>
        </nav>
    </header>

    <main class="gallery-container">
        <h1 class="gallery-title">Fotogalerie</h1>
        <iframe src="https://padlet.com/embed/s02401yg5bve72i2wj0v" allow="camera;microphone;geolocation;display-capture;clipboard-write" class="padlet-iframe"></iframe>
    </main>
</body>
</html>
