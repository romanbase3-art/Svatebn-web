<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie - Naše svatba</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            color: #4a4a4a;
            background-color: #faf9f6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #333;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .gallery-container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-title {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            color: #333;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
                padding: 15px;
            }
            header .logo {
                margin-bottom: 15px;
                text-align: center;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            nav a {
                margin-left: 0;
            }
            .gallery-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLÁRA & ROMAN</div>
        <nav>
            <a href="index.html">Úvod</a>
            <a href="index.html#o-nas">O nás</a>
            <a href="index.html#svatba">Svatba</a>
            <a href="galerie.html">Galerie</a>
            <a href="index.html#kontakt">Kontakt</a>
        </nav>
    </header>

    <main class="gallery-container">
        <h1 class="gallery-title">Fotogalerie</h1>
        <div class="padlet-embed" style="border:1px solid rgba(0,0,0,0.1);border-radius:2px;box-sizing:border-box;overflow:hidden;position:relative;width:100%;background:#F4F4F4">
            <p style="padding:0;margin:0">
                <iframe src="https://padlet.com/embed/s02401yg5bve72i2wj0v" frameborder="0" allow="camera;microphone;geolocation;display-capture;clipboard-write" style="width:100%;height:700px;display:block;padding:0;margin:0"></iframe>
            </p>
        </div>
    </main>
</body>
</html>
