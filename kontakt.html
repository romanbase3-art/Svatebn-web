<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potvrzení účasti - Klára & Roman</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Základní reset a nastavení */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #faf9f6;
            color: #4a4a4a;
            line-height: 1.8;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            letter-spacing: 2px;
        }

        /* Hlavička & Navigace */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #333;
            text-decoration: none;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }
        nav a.active {
            font-weight: 500;
            border-bottom: 2px solid #8c7a6b;
            padding-bottom: 4px;
        }
        nav a:hover {
            color: #8c7a6b;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #333;
            outline: none;
        }

        /* Hero sekce */
        .hero-rsvp {
            position: relative;
            height: 40vh;
            min-height: 300px;
            background: url('https://github.com/romanbase3-art/Svatebn-web/blob/main/pozadi_svatba_1.jpg?raw=true') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .hero-rsvp::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            padding: 0 20px;
        }

        .hero-subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .hero-title {
            font-size: 42px;
            letter-spacing: 3px;
        }

        /* Sekce Formuláře */
        .rsvp-container {
            max-width: 680px;
            margin: -50px auto 80px auto;
            position: relative;
            z-index: 10;
            padding: 0 20px;
        }

        .rsvp-card {
            background-color: #ffffff;
            padding: 45px 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #efece8;
        }

        .rsvp-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .rsvp-header h2 {
            font-size: 30px;
            color: #222;
            margin-bottom: 10px;
        }

        .rsvp-header p {
            font-size: 14px;
            color: #777;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0dcd7;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #4a4a4a;
            background-color: #faf9f6;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #857263;
            background-color: #ffffff;
        }

        .radio-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            font-weight: 300;
        }

        .radio-label input[type="radio"] {
            accent-color: #857263;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: #857263;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: #6e5e51;
            transform: translateY(-2px);
        }

        /* Patička */
        footer {
            text-align: center;
            padding: 35px 20px;
            background-color: #ffffff;
            font-size: 13px;
            color: #777;
            border-top: 1px solid #e0e0e0;
        }

        /* Responsivita pro mobilní zařízení */
        @media (max-width: 768px) {
            header {
                flex-direction: row;
                flex-wrap: wrap;
                padding: 15px 20px;
            }

            .menu-toggle {
                display: block;
            }

            nav {
                display: none;
                flex-direction: column;
                width: 100%;
                text-align: center;
                margin-top: 15px;
            }

            nav.active {
                display: flex;
            }

            nav a {
                margin: 10px 0;
                font-size: 13px;
            }

            .hero-title {
                font-size: 30px;
            }

            .rsvp-card {
                padding: 30px 20px;
            }

            .rsvp-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Hlavička a Navigace -->
    <header>
        <a href="index.html" class="logo">KLÁRA & ROMAN</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Otevřít menu">
            <i class="fa-solid fa-bars" id="menuIcon"></i>
        </button>
        <nav id="mainNav">
            <a href="index.html">Úvod</a>
            <a href="o-nas.html">O nás</a>
            <a href="svatba.html">Svatba</a>
            <a href="galerie.html">Galerie</a>
            <a href="kontakt.html" class="active">Kontakt</a>
        </nav>
    </header>

    <!-- Hero Sekce -->
    <section class="hero-rsvp">
        <div class="hero-content">
            <h2 class="hero-subtitle">Svatba Klára & Roman</h2>
            <h1 class="hero-title">POTVRZENÍ ÚČASTI</h1>
        </div>
    </section>

    <!-- Karta s Formulářem -->
    <main class="rsvp-container">
        <div class="rsvp-card">
            
            <div class="rsvp-header">
                <h2>Budeš tam s námi?</h2>
                <p>Prosíme o vyplnění formuláře do <strong>30. dubna 2027</strong>, abychom mohli vše včas naplánovat.</p>
            </div>

            <form action="https://api.web3forms.com/submit" method="POST">
                <!-- Váš klíč z Web3Forms -->
                <input type="hidden" name="access_key" value="TUTAJ_VLOZTE_VAS_ACCESS_KEY">
                
                <!-- Předmět e-mailu -->
                <input type="hidden" name="subject" value="Nová RSVP odpověď - Svatba Klára & Roman">
                
                <!-- Ochrana proti spamu -->
                <input type="checkbox" name="botcheck" style="display: none;">

                <!-- Jméno a příjmení -->
                <div class="form-group">
                    <label for="name">Jméno a příjmení hlavní osoby *</label>
                    <input type="text" id="name" name="Jmeno_a_prijmeni" placeholder="Jan Novák" required>
                </div>

                <!-- Účast -->
                <div class="form-group">
                    <label>Potvrzení účasti *</label>
                    <div class="radio-options">
                        <label class="radio-label">
                            <input type="radio" name="Ucast" value="Ano, dorazím(e)" checked required>
                            Ano, moc rád/a dorazím!
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="Ucast" value="Bohužel nedorazím(e)">
                            Bohužel se nemohu zúčastnit
                        </label>
                    </div>
                </div>

                <!-- Doprovod -->
                <div class="form-group">
                    <label for="guests">Doprovod / Děti (Jména)</label>
                    <input type="text" id="guests" name="Doprovod_a_deti" placeholder="např. Partnerka Jana + syn Tomáš">
                </div>

                <!-- Ubytování -->
                <div class="form-group">
                    <label for="accommodation">Zájem o ubytování na zámku</label>
                    <select id="accommodation" name="Ubytovani">
                        <option value="Nevyžaduji">Mám zajištěno / Nevyžaduji ubytování</option>
                        <option value="Mám zájem">Mám zájem o ubytování na místě</option>
                    </select>
                </div>

                <!-- Dieta -->
                <div class="form-group">
                    <label for="diet">Potravinová omezení / Dieta</label>
                    <input type="text" id="diet" name="Dietni_omezeni" placeholder="např. Bezlepková dieta, vegetarián, celiakie...">
                </div>

                <!-- Písnička na přání -->
                <div class="form-group">
                    <label for="song">Písnička na přání</label>
                    <input type="text" id="song" name="Song_na_prani" placeholder="Jaká písnička vás zaručeně dostane na parket?">
                </div>

                <!-- Vzkaz -->
                <div class="form-group">
                    <label for="message">Vzkaz nebo poznámka pro snoubence</label>
                    <textarea id="message" name="Vzkaz" rows="4" placeholder="Cokoliv dalšího, co byste nám chtěli vázat..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Odeslat odpověď</button>
            </form>

        </div>
    </main>

    <!-- Patička -->
    <footer>
        <p>&copy; 2027 Klára & Roman</p>
    </footer>

    <!-- Skript pro mobilní navigaci -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');

        menuToggle.addEventListener('click', () => {
            mainNav.classList.toggle('active');
        });

        document.querySelectorAll('#mainNav a').forEach(link => {
            link.addEventListener('click', () => {
                mainNav.classList.remove('active');
            });
        });
    </script>
</body>
</html>
