<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naše svatba</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            color: #4a4a4a;
            background-color: #faf9f6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #333;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #4a4a4a;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .hero {
            position: relative;
            height: 120vh;
            background: url('https://github.com/romanbase3-art/Svatebn-web/blob/main/pozadi_index_1.jpg?raw=true') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .hero-subtitle {
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 50px;
            font-weight: 400;
            letter-spacing: 4px;
        }
        .countdown {
            padding: 60px 20px;
            background-color: #ffffff;
            text-align: center;
        }
        .countdown-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-style: italic;
            color: #4a4a4a;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .timer {
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .number {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            color: #333;
            margin-bottom: 5px;
        }
        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
                padding: 15px;
            }

            header .logo {
                margin-bottom: 15px;
                text-align: center;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }

            nav a {
                margin-left: 0;
            }
            .hero-title { font-size: 32px; } 
        }

        /* Styly pro informační bloky */
        .info-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 50px;
            flex-wrap: nowrap;
        }
        .info-item {
            text-align: center;
            color: #333333;
            width: 30%;
        }
        .info-item i {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #333333;
        }
        .info-item h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .info-item p {
            font-size: 0.85rem;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KLÁRA & ROMAN</div>
        <nav>
            <a href="#">Úvod</a>
            <a href="#">O nás</a>
            <a href="#">Svatba</a>
            <a href="galerie.html">Galerie</a>
            <a href="#">Kontakt</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-subtitle">Těšíme se na náš svatební den</h2>
            <h1 class="hero-title">KLÁRA & ROMAN</h1>
        </div>
    </section>

    <section class="countdown">
        <div class="countdown-title">Již brzy to spolu oslavíme</div>
        <div class="timer">
            <div class="time-block">
                <span class="number" id="days">00</span>
                <span class="label">Dny</span>
            </div>
            <div class="time-block">
                <span class="number" id="hours">00</span>
                <span class="label">Hodiny</span>
            </div>
            <div class="time-block">
                <span class="number" id="minutes">00</span>
                <span class="label">Minuty</span>
            </div>
            <div class="time-block">
                <span class="number" id="seconds">00</span>
                <span class="label">Sekundy</span>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <i class="fa-regular fa-calendar-days"></i>
                <h3>Datum</h3>
                <p>4. září 2027</p>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <h3>Lokalita</h3>
                <p>Zámecký park<br>Prčice</p>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-user-tie"></i>
                <h3>Dress Code</h3>
                <p>Semi-Formální</p>
            </div>
        </div>
    </section>

    <script>
        // Zde nastav datum svatby (Rok, Měsíc-1, Den, Hodina, Minuta, Sekunda)
        const weddingDate = new Date(2027, 8, 4, 12, 0, 0).getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-title").innerText = "Den D je tady!";
            }
        }, 1000);
    </script>
</body>
</html>
